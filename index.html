<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bianca Amaral // Tech Nexus Blog</title>
    <style>
        /* CORE DESIGN SYSTEM (Tons de Azul Tecnológico) */
        :root[data-theme="dark"] {
            --bg-base: #030712;
            --bg-surface: #0b1329;
            --bg-surface-elevated: #1c2541;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.15);
            --secondary: #818cf8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(56, 189, 248, 0.12);
            --gradient-header: linear-gradient(135deg, #020617 0%, #0b1329 100%);
            --shadow-premium: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        :root[data-theme="light"] {
            --bg-base: #f0f4f9;
            --bg-surface: #ffffff;
            --bg-surface-elevated: #e2e8f0;
            --primary: #0284c7;
            --primary-glow: rgba(2, 132, 199, 0.1);
            --secondary: #4f46e5;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(2, 132, 199, 0.15);
            --gradient-header: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            --shadow-premium: 0 20px 40px rgba(15, 23, 42, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s, border-color 0.3s, color 0.3s, box-shadow 0.3s;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER & SISTEMA DE NAVEGAÇÃO */
        header {
            background: var(--gradient-header);
            padding: 80px 20px;
            text-align: center;
            position: relative;
            border-bottom: 2px solid var(--border-color);
        }

        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-control:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
        }

        header h1 {
            font-size: 3.8rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 12px;
            color: #fff;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
        }

        header h1 span {
            color: var(--primary);
        }

        header p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto;
        }

        /* DASHBOARD DE CRIAÇÃO (EDITOR DE POSTS INTEGRADO) */
        .editor-section {
            max-width: 800px;
            width: 90%;
            margin: -40px auto 40px auto;
            background: var(--bg-surface);
            border: 2px solid var(--primary);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow-premium);
            display: none; /* Ativado via botão */
            position: relative;
            z-index: 5;
        }

        .editor-section.active {
            display: block;
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .editor-section h3 {
            margin-bottom: 20px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .form-group textarea {
            height: 150px;
            resize: vertical;
        }

        .btn-submit {
            background: var(--primary);
            color: #030712;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
        }

        /* GRID CENTRAL DE POSTAGENS */
        main {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 35px;
            flex-grow: 1;
        }

        @media (max-width: 500px) {
            main { grid-template-columns: 1fr; }
        }

        /* CARDS ULTRA ELABORADOS V2 */
        article {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-premium);
            position: relative;
        }

        article:hover {
            transform: translateY(-10px) scale(1.01);
            border-color: var(--primary);
            box-shadow: 0 25px 50px rgba(58, 134, 255, 0.15);
        }

        .card-inner {
            padding: 35px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tag-tech {
            background: var(--primary-glow);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .post-time {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        article h2 {
            font-size: 1.7rem;
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.3;
        }

        /* Textos sem limite de tamanho - expansíveis */
        .post-body-text {
            font-size: 1rem;
            line-height: 1.75;
            color: var(--text-muted);
            margin-bottom: 30px;
            flex-grow: 1;
            white-space: pre-line; /* Preserva quebras de linhas que você digitar */
        }

        .card-bottom-bar {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-glow {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .profile-info h4 {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        /* SISTEMA DE INTERAÇÃO MATRIX LIKE */
        .btn-like-cyber {
            background: var(--primary-glow);
            border: 1px solid var(--border-color);
            color: var(--primary);
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .btn-like-cyber:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: #ef4444;
        }

        .like-counter-bubble {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.85rem;
        }

        /* Efeito de partículas tridimensionais */
        .pop-particle {
            position: absolute;
            pointer-events: none;
            animation: burst 0.7s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            font-size: 1.4rem;
        }

        @keyframes burst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0.3); opacity: 0; }
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* FOOTER */
        footer {
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 40px;
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: auto;
        }

        footer b {
            color: var(--primary);
