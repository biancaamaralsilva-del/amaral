<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bianca Amaral // Lab Digital</title>
    <style>
        /* DESIGN SYSTEM - GLOW CIBERNÉTICO & GLASSMORPHISM */
        :root {
            --bg-deep: #050b14;
            --bg-grid: rgba(0, 245, 212, 0.02);
            --glass-base: rgba(11, 22, 44, 0.6);
            --glass-border: rgba(56, 189, 248, 0.15);
            --glow-cyan: #00f5d4;
            --glow-blue: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --font-stack: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-stack);
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Orbes Abstratas de Luz no Fundo */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
            filter: blur(60px);
            z-index: -1;
            pointer-events: none;
        }
        body::before { top: -100px; left: -100px; }
        body::after { bottom: 10%; right: -100px; background: radial-gradient(circle, rgba(0, 245, 212, 0.1) 0%, transparent 70%); }

        /* HEADER SLIM PREMIUM */
        header {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 60px 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-titles h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .header-titles h1 span {
            background: linear-gradient(to right, var(--glow-blue), var(--glow-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-titles p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
        }

        .header-action .btn-trigger {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .header-action .btn-trigger:hover {
            border-color: var(--glow-cyan);
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.2);
            transform: translateY(-2px);
        }

        /* EDITOR POPUP FLUTUANTE */
        .panel-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .panel-backdrop.visible {
            opacity: 1; pointer-events: auto;
        }

        .panel-body {
            background: var(--glass-base);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 28px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .panel-backdrop.visible .panel-body { transform: translateY(0); }

        .panel-body h3 { font-size: 1.5rem; margin-bottom: 24px; color: var(--glow-blue); }

        .input-box { margin-bottom: 20px; }
        .input-box label { display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: 1px; }
        .input-box input, .input-box textarea {
            width: 100%; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 12px; color: #fff; font-size: 1rem; outline: none;
        }
        .input-box textarea { height: 180px; resize: none; }
        .input-box input:focus, .input-box textarea:focus { border-color: var(--glow-cyan); }

        .panel-buttons { display: flex; gap: 12px; margin-top: 24px; }
        .btn-action { flex: 1; padding: 14px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; font-size: 1rem; }
        .btn-action.save { background: linear-gradient(90deg, var(--glow-blue), var(--glow-cyan)); color: #050b14; }
        .btn-action.cancel { background: transparent; border: 1px solid var(--glass-border); color: var(--text-secondary); }

        /* SEÇÃO DE GRID DE POSTS (FLEXBOX DINÂMICO) */
        main {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 50px 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }

        /* CARD SEM FRONTEIRAS RÍGIDAS (CONCEITO DESIGN MINIMALISTA) */
        article {
            flex: 1 1 45%;
            min-width: 320px;
            background: var(--glass-base);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 40px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        article:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 245, 212, 0.4);
            box-shadow: 0 20px 40px rgba(0, 245, 212, 0.05);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .post-index {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--glow-cyan);
            border: 1px solid rgba(0, 245, 212, 0.3);
            padding: 4px 10px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .post-meta-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        article h2 {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        /* Área de conteúdo infinita sem quebras de layout */
        .post-editorial {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 40px;
            white-space: pre-line; /* Permite parágrafos imensos livremente */
            flex-grow: 1;
        }

        .post-interactive-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 24px;
            margin-top: auto;
        }

        .author-tag {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .author-tag::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: var(--glow-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--glow-cyan);
        }

        /* BOTÃO DE REAÇÃO INTEGRADO */
        .interaction-pulse-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            transition: all 0.3s;
        }

        .interaction-pulse-btn:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--glow-blue);
        }

        .count-badge {
            color: var(--glow-blue);
            font-variant-numeric: tabular-nums;
        }

        /* Partículas Fluidas */
        .ring-particle {
            position: absolute;
            width: 10px; height: 10px;
            background: var(--glow-blue);
            border-radius: 50%;
            pointer-events: none;
            animation: eject 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes eject {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(0); opacity: 0; }
        }

        /* FOOTER */
        footer {
            max-width: 1200px;
            width: 100%;
            margin: auto auto 0 auto;
            padding: 40px 24px;
