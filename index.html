<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bianca Amaral // Quantum Tech Lab</title>
    <style>
        /* DESIGN SYSTEM - GLOW CIBERNÉTICO ULTRA VISUAL */
        :root {
            --bg-espacial: #020617;
            --bg-grid: rgba(56, 189, 248, 0.03);
            --vidro-puro: rgba(15, 23, 42, 0.65);
            --vidro-borda: rgba(56, 189, 248, 0.25);
            --neon-azul: #38bdf8;
            --neon-cian: #00f5d4;
            --neon-rosa: #f43f5e;
            --texto-principal: #ffffff;
            --texto-suave: #94a3b8;
            --sombra-neon: 0 0 30px rgba(56, 189, 248, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-espacial);
            background-image: 
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 50px 50px;
            color: var(--texto-principal);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Orbes Gigantes de Luz Néon que dão o efeito de "aparecer" na tela */
        .orbe-luz-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            top: -200px;
            left: -150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }
        .orbe-luz-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            bottom: 10%;
            right: -150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 245, 212, 0.15) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }

        /* HEADER GRANDE E IMPACTANTE */
        header {
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            padding: 80px 24px 40px 24px;
            text-align: center;
            position: relative;
        }

        .logo-area {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--neon-azul);
            border-radius: 50px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-azul);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1.1;
            margin-bottom: 16px;
        }

        header h1 span {
            background: linear-gradient(135deg, #ffffff 30%, var(--neon-azul), var(--neon-cian));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--texto-suave);
            font-size: 1.25rem;
            max-width: 700px;
            margin: 0 auto 40px auto;
            font-weight: 300;
            line-height: 1.6;
        }

        /* BOTÃO DE ESCREVER GRANDE QUE CHAMA ATENÇÃO */
        .btn-abrir-painel {
            background: linear-gradient(135deg, var(--neon-azul), var(--neon-cian));
            color: #020617;
            border: none;
            padding: 16px 36px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 0 25px rgba(0, 245, 212, 0.4);
            transition: all 0.3s ease;
        }

        .btn-abrir-painel:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 35px rgba(0, 245, 212, 0.6);
        }

        /* EDITOR POPUP INTEGRADO (FORMULÁRIO GRANDE E IMPRESSIONANTE) */
        .modal-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-background.active {
            opacity: 1; pointer-events: auto;
        }

        .modal-container {
            background: var(--vidro-puro);
            border: 1px solid var(--vidro-borda);
            backdrop-filter: blur(25px);
            padding: 45px;
            border-radius: 32px;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), var(--sombra-neon);
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-background.active .modal-container { transform: scale(1) translateY(0); }

        .modal-container h3 { font-size: 1.8rem; margin-bottom: 24px; color: #fff; font-weight: 800; }
        .modal-container h3 span { color: var(--neon-cian); }

        .field-box { margin-bottom: 24px; }
        .field-box label { display: block; font-size: 0.85rem; text-transform: uppercase; color: var(--neon-azul); margin-bottom: 10px; letter-spacing: 1px; font-weight: 700; }
        .field-box input, .field-box textarea {
            width: 100%; padding: 16px; background: rgba(0,0,0,0.4); border: 1px solid var(--vidro-borda); border-radius: 14px; color: #fff; font-size: 1.05rem; outline: none; transition: all 0.3s;
        }
        .field-box textarea { height: 200px; resize: none; }
        .field-box input:focus, .field-box textarea:focus { border-color: var(--neon-cian); box-shadow: 0 0 15px rgba(0, 245, 212, 0.2); }

        .modal-actions { display: flex; gap: 16px; margin-top: 30px; }
        .btn-modal { flex: 1; padding: 16px; border-radius: 14px; border: none; cursor: pointer; font-weight: 700; font-size: 1.05rem; transition: all 0.2s; }
        .btn-modal.confirm { background: linear-gradient(135deg, var(--neon-azul), var(--neon-cian)); color: #020617; }
        .btn-modal.cancel { background: transparent; border: 1px solid var(--vidro-borda); color: var(--texto-suave); }
        .btn-modal.cancel:hover { background: rgba(255,255,255,0.05); color: #fff; }

        /* SEÇÃO DE GRID DE POSTS (FLEXBOX GRANDE E RESPONSIVO) */
        main {
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }

        /* CARDS MAIORES E ELABORADOS COM GLASSMORPHISM GLOW */
        article {
            flex: 1 1 100%; /* Inicia grande ocupando espaço de destaque */
            background: var(--vidro-puro);
            border: 1px solid var(--vidro-borda);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 45px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Quando houver mais de um, eles se dividem em duas colunas lindas no PC */
        @media (min-width: 900px) {
            article { flex: 1 1 45%; }
        }

        article:hover {
            transform: translateY(-8px);
            border-color: var(--neon-azul);
            box-shadow: 0 20px 50px rgba(56, 189, 248, 0.15), var(--sombra-neon);
        }

        .post-top-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .badge-design {
            font-size: 0.75rem;
            font-weight: 800;
            color: #020617;
            background: linear-gradient(135deg, var(--neon-azul), var(--neon-cian));
            padding: 6px 14px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .meta-date {
            font-size: 0.9rem;
            color: var(--texto-suave);
        }

        article h2 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--texto-principal);
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Área de conteúdo robusta perfeita para textos enormes */
        .post-main-content {
            font-size: 1.15rem;
            line-height: 1.85;
            color: var(--texto-suave);
            margin-bottom: 40px;
            white-space: pre-line; /* Mantém a formatação que você digitar inteira */
            flex-grow: 1;
        }

        .post-footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(56, 189, 248, 0.15);
            padding-top: 28px;
            margin-top: auto;
        }

        .author-identity {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--texto-principal);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .author-identity-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-cian);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--neon-cian);
