<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bianca Amaral // Holo-Deck Lab</title>
    <style>
        /* CORE REVOLUTIONARY DESIGN SYSTEM (CYBER BLUE & NEON GLOW) */
        :root {
            --fundo-vazio: #01030a;
            --grade-energia: rgba(0, 180, 216, 0.03);
            --vidro-liquido: rgba(6, 12, 26, 0.7);
            --borda-laser: rgba(0, 180, 216, 0.25);
            --laser-azul: #00b4d8;
            --laser-cian: #0df5e3;
            --laser-rosa: #ff0055;
            --texto-luz: #ffffff;
            --texto-esmaecido: #748cab;
            --brilho-neon: 0 0 25px rgba(0, 180, 216, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--fundo-vazio);
            background-image: 
                linear-gradient(var(--grade-energia) 1px, transparent 1px),
                linear-gradient(90deg, var(--grade-energia) 1px, transparent 1px);
            background-size: 60px 60px;
            color: var(--texto-luz);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Efeito de Nebulosa de Luz no Fundo da Tela */
        .nebulosa-core {
            position: absolute;
            width: 800px;
            height: 500px;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 180, 216, 0.15) 0%, transparent 65%);
            filter: blur(100px);
            z-index: -1;
            pointer-events: none;
        }

        /* PAINEL HOLOGRÁFICO PRINCIPAL (HEADER) */
        header {
            max-width: 1200px;
            width: 90%;
            margin: 60px auto 40px auto;
            background: var(--vidro-liquido);
            border: 1px solid var(--borda-laser);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: var(--brilho-neon);
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; width: 80%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--laser-cian), transparent);
        }

        .terminal-tag {
            display: inline-block;
            font-size: 0.8rem;
            color: var(--laser-cian);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            line-height: 1.1;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff 40%, var(--laser-azul));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--texto-esmaecido);
            font-size: 1.15rem;
            max-width: 650px;
            margin: 0 auto 35px auto;
            line-height: 1.6;
            font-weight: 300;
        }

        /* BOTÃO DE INTERAÇÃO FLUIDA */
        .btn-launch-terminal {
            background: transparent;
            border: 1px solid var(--laser-cian);
            color: var(--laser-cian);
            padding: 14px 32px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(13, 245, 227, 0.1);
        }

        .btn-launch-terminal:hover {
            background: var(--laser-cian);
            color: var(--fundo-vazio);
            box-shadow: 0 0 25px rgba(13, 245, 227, 0.4);
            transform: translateY(-2px);
        }

        /* FORMULÁRIO POPUP DE CONTEÚDO (DENTRO DO VIDRO) */
        .backdrop-blur-system {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 3, 10, 0.9);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .backdrop-blur-system.active {
            opacity: 1; pointer-events: auto;
        }

        .panel-crypto-form {
            background: var(--vidro-liquido);
            border: 1px solid rgba(13, 245, 227, 0.3);
            padding: 45px;
            border-radius: 28px;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 40px rgba(0, 180, 216, 0.15);
            transform: scale(0.95);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .backdrop-blur-system.active .panel-crypto-form { transform: scale(1); }

        .panel-crypto-form h3 { font-size: 1.6rem; margin-bottom: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .panel-crypto-form h3 span { color: var(--laser-cian); }

        .form-field { margin-bottom: 24px; }
        .form-field label { display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--laser-azul); margin-bottom: 8px; letter-spacing: 1.5px; font-weight: 700; }
        .form-field input, .form-field textarea {
            width: 100%; padding: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--borda-laser); border-radius: 12px; color: #fff; font-size: 1rem; outline: none; transition: all 0.3s;
        }
        .form-field textarea { height: 180px; resize: none; }
        .form-field input:focus, .form-field textarea:focus { border-color: var(--laser-cian); box-shadow: 0 0 15px rgba(13, 245, 227, 0.15); }

        .form-actions { display: flex; gap: 16px; }
        .btn-form { flex: 1; padding: 16px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; font-size: 1rem; transition: all 0.2s; }
        .btn-form.publish { background: var(--laser-cian); color: var(--fundo-vazio); }
        .btn-form.discard { background: transparent; border: 1px solid var(--borda-laser); color: var(--texto-esmaecido); }
        .btn-form.discard:hover { color: #fff; background: rgba(255,255,255,0.03); }

        /* SEÇÃO DE ARQUIVOS (FLEXBOX DESIGN RESPONSIVO) */
        main {
            max-width: 1200px;
            width: 90%;
            margin: 0 auto;
            padding: 20px 0 60px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 35px;
        }

        /* CARDS MAIORES E MAIS IMPONENTES COM EFEITO DE BORDA BRILHANTE */
        article {
            flex: 1 1 100%;
            background: var(--vidro-liquido);
            border: 1px solid var(--borda-laser);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (min-width: 850px) {
            article { flex: 1 1 45%; }
        }

        article:hover {
            transform: translateY(-6px);
            border-color: var(--laser-azul);
            box-shadow: 0 20px 45px rgba(0, 180, 216, 0.1), var(--brilho-neon);
        }

        .article-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .category-laser {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--laser-azul);
            border: 1px solid var(--borda-laser);
            padding: 4px 12px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0, 180, 216, 0.05);
        }

        .timeline-stamp {
            font-size: 0.85rem;
            color: var(--texto-esmaecido);
        }

        article h2 {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.3;
            color: var(--texto-luz);
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* Espaço de texto amplo configurado para suportar redações imensas */
        .editorial-body {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--texto-esmaecido);
            margin-bottom: 35px;
            white-space: pre-line; /* Mantém toda a sua quebra de linha intacta */
            flex-grow: 1;
        }

        .article-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0, 180, 216, 0.1);
            padding-top: 24px;
            margin-top: auto;
        }

        .signature-area {
            font-size: 1rem;
            font-weight: 600;
            color: var(--texto-luz);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .signature-pulse {
            width: 6px;
            height: 6px;
            background-color: var(--laser-cian);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--laser-cian);
        }

        /* BOTÃO DE CURTIR LASER PULSE */
        .btn-laser-pulse {
            background: rgba(0, 180, 216, 0.05);
            border: 1px solid var(--borda-laser);
